[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "belay"
version = "0.1.0"
description = "Certified red-line detection for closed models"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
# Lab side only. The certifier must never install this.
detector = [
    "headspace-ambient-transducer",
    "torch>=2.0",
    "transformers>=4.40",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
headspace-ambient-transducer = { path = "../headspace-ambient-transducer", editable = true }

[project.scripts]
belay-stub = "belay.contract.stub:main"

[tool.hatch.build.targets.wheel]
packages = ["belay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
